<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EIP-712 Hash Debug</title>
  <!-- Pull ethers from a CDN -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.11.1/dist/ethers.umd.min.js"></script>
</head>
<body>
<script>
// Domain that matches your resolver on Sepolia
const domain = {
  name: "Resolver",
  version: "1",
  chainId: 11155111,
  verifyingContract: "0xa5C662e0b7133D2d9B372Bd21f97049df2f66F68"
};

// Types must exactly match your Solidity struct
const types = {
  Claim: [
    { name: "filehash", type: "bytes32" },
    { name: "chain", type: "uint256" },
    { name: "contractAddress", type: "address" },
    { name: "tokenid", type: "uint256" },
    { name: "registrant", type: "address" },
    { name: "nonce", type: "uint256" },
    { name: "deadline", type: "uint256" },
    { name: "checkedAtL2BlockHash", type: "bytes32" }
  ]
};

// Example claim (adjust values if needed)
const message = {
  filehash: "0x5f16f3f2b8d3b7c7a2b8f1f2d2c3e4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b",
  chain: 137,
  contractAddress: "0x1111111111111111111111111111111111111111",
  tokenid: 123,
  registrant: "0x6Bb59230999E48d216bc15767748482D4cE47dE4",
  nonce: 0,
  deadline: 2000000000,
  checkedAtL2BlockHash: "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
};

// Compute digest
const digest = ethers.TypedDataEncoder.hash(domain, types, message);
console.log("EIP712 digest:", digest);
</script>
</body>
</html>
