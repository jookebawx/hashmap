<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashmap: NFT Resolver Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-6">
    
    <div class="max-w-3xl mx-auto text-center">
        <button onclick="connectMetaMask()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">
            Connect MetaMask
        </button>
    </div>

    <div id="walletAddress" class="hidden text-center mt-4">
        <p class="text-lg font-semibold">Connected Wallet Address: <span id="address" class="text-yellow-300"></span></p>
    </div>
    
    <div id="upload" class="hidden max-w-lg mx-auto mt-6 p-6 bg-gray-800 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">Upload File</h1>
        <form id="uploadForm" class="space-y-4">
            <input type="file" name="fileToUpload" id="fileToUpload" class="block w-full text-sm text-gray-300 file:bg-blue-500 file:text-white file:py-2 file:px-4 file:rounded-lg">
            <button type="button" onclick="verify()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg">
                Verify
            </button>
        </form>
    </div>
    
    <div id="chainResult" class="mt-4 text-center"></div>
    <div id="openseaResult" class="mt-4 text-center"></div>
    
    <div id="check" class="hidden max-w-lg mx-auto mt-6 p-6 bg-gray-800 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">Register your NFT</h1>
        <form id="RegisterNFT" class="space-y-4">
            <label for="chainDropdown" class="block text-gray-300">Blockchain Network:</label>
            <select id="chainDropdown" class="block w-full p-2 border rounded-lg bg-gray-700 text-white"></select>
            
            <label for="contractAddress" class="block text-gray-300">Contract Address:</label>
            <input type="text" id="contractAddress" name="contractAddress" required class="block w-full p-2 border rounded-lg bg-gray-700 text-white">
            
            <label for="tokenId" class="block text-gray-300">Token ID:</label>
            <input type="number" id="tokenId" name="tokenId" required class="block w-full p-2 border rounded-lg bg-gray-700 text-white">
            
            <button type="button" onclick="registernft()" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded-lg">
                Register
            </button>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script src="https://cdn.ethers.io/lib/ethers-5.0.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
